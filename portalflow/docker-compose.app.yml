x-application: &application
  image: portalflow:local
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile
  env_file: .env
  environment: &environment
    NODE_ENV: development
    DATABASE_URL: postgresql://portalflow:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/portalflow
    REDIS_URL: redis://redis:6379
    SMTP_HOST: mailpit
    API_URL: http://api:4000
  restart: unless-stopped
services:
  migrate:
    <<: *application
    command: ["pnpm", "--filter", "@portalflow/database", "migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *application
    command: ["node", "apps/api/dist/main.js"]
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
  web:
    <<: *application
    command: ["pnpm", "--filter", "@portalflow/web", "start"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
  worker:
    <<: *application
    command: ["node", "apps/worker/dist/main.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
